version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_farmacia_db
    restart: always
    environment:
      POSTGRES_DB: farmacia_b2b_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: django_farmacia_app
    restart: always
    command: >
      sh -c "python manage.py makemigrations store &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=farmacia_b2b_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      - db

volumes:
  pgdata:
